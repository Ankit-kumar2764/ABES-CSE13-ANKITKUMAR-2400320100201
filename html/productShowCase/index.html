<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product showcase</title>
    <link rel="stylesheet" href="style.css">
    <link rel=“icon” type = “image/x-icon” href=“favicon.ico”>

    
</head>
<body>
    <header>
        <h1>my online store</h1>
    </header>
    <section class="products">
          <article class="card">
            <img src="https://image.euronics.de/media/image/a3/16/f9/01d7f0ba-cb3d-40d1-8eb0-80fd5df8a6ca.jpg" alt="Product 1">
            <h3>smartphone</h3>
            <p class="price">INR 1,59,999</p>
            <a href="#" class="btn">Add to Cart</a>
          </article>
            <article class="card">
                <img src="https://m.media-amazon.com/images/I/71s4mjiit3L._AC_SL1500_.jpg" alt="Product 2">
                <h3>smart watch</h3>
                <p class="price">INR 2,999</p>

                <a href="#" class="btn">Add to Cart</a>
            </article>
            <article class="card">
                <img src="https://cdn.pixabay.com/photo/2023/10/12/13/05/headphones-8310796_1280.jpg" alt="Product 3">
                <h3>headphones</h3>
               <p class="price">INR 3,999</p>

                <a href="#" class="btn">Add to Cart</a>
            </article>
            <article class="card">
                <img src="https://images.samsung.com/is/image/samsung/assets/in/tablets/galaxy-tab-s11/buy/TS11-KV_PC_1600x864.jpg?imbypass=true" alt="Product 4">
                <h3>Tablet</h3>
               <p class="price">INR 12,000</p>

                <a href="#" class="btn">Add to Cart</a>
            </article>
            <article class="card">
                <img src="https://laptopmedia.com/wp-content/uploads/2022/07/3-1.jpg" alt="Product 5">
                <h3>laptop</h3>
               <p class="price">INR 47,000</p>

                <a href="#" class="btn">Add to Cart</a>
            </article>
            <article class="card">
                <img src="https://pisces.bbystatic.com/image2/BestBuy_US/images/products/6425/6425811_rd.jpg" alt="Product 6">
                <h3>router</h3>
               <p class="price">INR 15,000</p>

                <a href="#" class="btn">Add to Cart</a>
            </article>
            </section>

            <footer>
         <p>&copy; 2025 My Online Store</p>
    </footer>
</body>
</html>
