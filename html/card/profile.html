<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eae2e2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: rgb(215, 211, 211);
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 300px;
      text-align: center;
      padding: 20px;
    }
    .avatar {
      border-radius: 50%;
      width: 100px;
      height: 100px;
    }
    .bio {
      font-size: 14px;
      color: #555;
    }
    .btn {
      display: inline-block;
      margin: 10px 5px;
      padding: 10px 15px;
      background-color: #007BFF;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }
    .btn:hover {
      background-color: #0056b3;
      transform : scale(1.05);
    }
    
  </style>
  
  
</head>
<body>
 
  <div class="card">
	<img src="ankit kumar.jpg" alt="Profile Picture" class="avatar">
	<h2>Ankit Kumar yadav</h2>
	<p class="bio">I am a Computer Science student who loves web development and problem solving.</p>
	<a href="mailto:ay9335144776@gmail.com" class="btn">Contact Me</a>
    <a href="https://www.linkedin.com/in/ankit-yadav-6b632b32a" class="btn">LinkedIn</a>

    <a href="https://github.com/Ankit-kumar2764" class="btn">GitHub</a>

    <a href="https://twitter.com/ankit_kumar" class="btn">Twitter</a>
  </div>
 
</body>
</html>
